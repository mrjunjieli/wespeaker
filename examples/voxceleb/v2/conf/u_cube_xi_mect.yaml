### train configuration
# U^3-xi MECT: uncertainty-aware MECT (U_Cube_XI pooling + analytically
# propagated diagonal covariance), following the U^3-xi recipe used by
# U_CUBE_XI_ReDimNet2B6.
#
#   - MECT: https://arxiv.org/abs/2609.24061 (backbone + training recipe)
#   - U^3-xi: https://arxiv.org/abs/2601.15719 (uncertainty pooling)
#
# Compared to conf/mect.yaml, only the pooling (ASTP -> U_Cube_XI) and
# the projection (sphereface2 -> sphereface2_uncertainty_arcguide_inter_intra
# with the alpha-scheduled auxiliary Arc CE loss) differ; the backbone and
# all other training hyper-parameters follow the MECT paper.

exp_dir: exp/U_CUBE_XI_MECT_B2-emb192-fbank80-num_frms200-aug0.6-spTrue-saFalse-SphereFace2Uncertainty-SGD-epoch120
gpus: "[0,1]"
num_avg: 10
enable_amp: false
data_type: shard

seed: 42
num_epochs: 120
save_epoch_interval: 10
log_batch_interval: 100

dataloader_args:
  # 2 GPUs x 256 = 512 in total, the same batch size as the MECT paper
  batch_size: 256
  num_workers: 8
  pin_memory: false
  prefetch_factor: 8
  drop_last: true

dataset_args:
  frontend: "fbank"
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  filter: true
  filter_args:
    min_num_frames: 100
    max_num_frames: 800
  resample_rate: 16000
  speed_perturb: true
  num_frms: 200 # 2-second segments in the training stage
  aug_prob: 0.6 # prob to add reverb & noise aug per sample
  fbank_args:
    num_mel_bins: 80
    frame_shift: 10
    frame_length: 25
    dither: 1.0
  spec_aug: false
  # MECT performs per-utterance cepstral mean normalization inside the
  # model, following the official implementation
  cmvn: false

model: U_CUBE_XI_MECT_B2
model_args:
  feat_dim: 80
  embed_dim: 192
  pooling_func: "U_Cube_XI"
  # MoE settings: frame-level dense MoE with 4 experts (F-Dense-4)
  moe_type: "token"
  num_experts_token: 4
  top_k_token: null
model_init: null

projection_args:
  project_type: "sphereface2_uncertainty_arcguide_inter_intra"
  scale: 32.0
  t: 3
  lanbuda: 0.7
  margin_type: "C"

# auxiliary Arc CE loss with uncertainty scaling, scheduled by epoch
# (train.py), the same as the U_CUBE_XI_ReDimNet2 recipe
alpha_schedule:
  alpha_final: 0.3
  alpha_warmup_start: 60
  alpha_warmup_end: 100

margin_scheduler: MarginScheduler
margin_update:
  initial_margin: 0.0
  final_margin: 0.2
  increase_start_epoch: 20
  fix_start_epoch: 40
  update_margin: true
  increase_type: "exp"

loss: CrossEntropyLoss
loss_args: {}

optimizer: SGD
optimizer_args:
  momentum: 0.9
  nesterov: true
  weight_decay: 2.0e-05

scheduler: ExponentialDecrease
scheduler_args:
  # effective peak lr = 0.075 * scale_ratio(8) = 0.6,
  # effective final lr = 5e-5 * 8 = 4e-4
  initial_lr: 0.075
  final_lr: 5.0e-05
  warm_up_epoch: 4
  warm_from_zero: true
