### Large margin fine-tuning configuration for U^3-xi MECT
#
#   The large margin fine-tuning operation is often used in speaker
#   verification challenge system to further improve the performance.
#   In this fine-tuning stage, large margin and longer segment will
#   be used.
#
# MECT paper LMF settings: fixed margin 0.3, lr 2e-4, 6-second
# segments, no speed perturbation.
# U^3-xi: https://arxiv.org/abs/2601.15719
# MECT: https://arxiv.org/abs/2609.24061
#
# NOTE: the plain sphereface2 projection does not consume the pooled
# covariance (see executor.py); it is used here to keep the same LM
# protocol as the U_CUBE_XI_ReDimNet2 recipe, while the model still
# returns the covariance so that uncertainty extraction/scoring keeps
# working.

exp_dir: exp/U_CUBE_XI_MECT_B2-emb192-fbank80-num_frms200-aug0.6-spTrue-saFalse-SphereFace2Uncertainty-SGD-epoch120-LM
gpus: "[0,1]"
num_avg: 1
enable_amp: false
data_type: shard
do_lm: True

seed: 42
num_epochs: 7
save_epoch_interval: 1
log_batch_interval: 100

dataloader_args:
  # 2 GPUs x 64 = 128 in total
  # effective peak lr = 1e-4 * scale_ratio(2) = 2e-4, the same as the paper
  batch_size: 64
  num_workers: 8
  pin_memory: false
  prefetch_factor: 8
  drop_last: true

dataset_args:
  frontend: "fbank"
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  filter: true
  filter_args:
    min_num_frames: 100
    max_num_frames: 800
  resample_rate: 16000
  # No speed perturb in the large-margin fine-tuning stage (paper)
  speed_perturb: false
  num_frms: 600 # 6-second segments in the LMF stage
  aug_prob: 0.6 # prob to add reverb & noise aug per sample
  fbank_args:
    num_mel_bins: 80
    frame_shift: 10
    frame_length: 25
    dither: 1.0
  spec_aug: false
  # MECT performs per-utterance cepstral mean normalization inside the
  # model, following the official implementation
  cmvn: false

model: U_CUBE_XI_MECT_B2
model_args:
  feat_dim: 80
  embed_dim: 192
  pooling_func: "U_Cube_XI"
  moe_type: "token"
  num_experts_token: 4
  top_k_token: null
model_init: null

projection_args:
  project_type: "sphereface2"
  scale: 32.0
  lanbuda: 0.7
  t: 3
  margin_type: "C"

# alpha_final: 0.0 disables the auxiliary ArcFace CE loss during LM
# fine-tuning (only relevant for the uncertainty projection variants)
alpha_schedule:
  alpha_final: 0.0
  alpha_warmup_start: 1
  alpha_warmup_end: 1

margin_scheduler: MarginScheduler
margin_update:
  # fixed margin 0.3 in the large-margin fine-tuning stage (paper)
  initial_margin: 0.3
  final_margin: 0.3
  increase_start_epoch: 0
  fix_start_epoch: 0
  update_margin: false
  increase_type: "exp"

loss: CrossEntropyLoss
loss_args: {}

optimizer: SGD
optimizer_args:
  momentum: 0.9
  nesterov: true
  weight_decay: 2.0e-05

scheduler: ExponentialDecrease
scheduler_args:
  # effective peak lr = 1e-4 * scale_ratio(2) = 2e-4
  initial_lr: 1.0e-4
  final_lr: 1.0e-05
  warm_up_epoch: 0
  warm_from_zero: false
